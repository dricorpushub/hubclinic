<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HubClinic — Gestão estratégica para clínicas">
  <title>HubClinic | Gestão Estratégica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">H</div>
        <div><strong>HubClinic</strong><span>Gestão estratégica</span></div>
      </div>
      <nav id="mainNav"></nav>
      <div class="sidebar-footer">
        <div class="clinic-badge">
          <img src="logo.png" alt="" onerror="this.style.display='none'">
          <div><strong>DriCorpus</strong><span>Ambiente demonstrativo</span></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="menuBtn" aria-label="Abrir menu">☰</button>
        <div>
          <p class="eyebrow" id="breadcrumb">Visão geral</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="top-actions">
          <div class="period-chip">Julho de 2026</div>
          <button class="icon-btn" title="Notificações">◌</button>
          <div class="avatar">AV</div>
        </div>
      </header>

      <section class="content" id="app"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
